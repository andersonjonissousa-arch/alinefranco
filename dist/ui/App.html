<script>
  var estado = { usuario: null, cad: null, tela: 'inicio' };

  var NOMES_LISTAS = {
    TIPO_SOLICITACAO: 'Tipo de solicitação',
    DESCRICAO_DEMANDA: 'Descrição da demanda',
    NECESSIDADE_ACOMPANHAMENTO: 'Necessidade de acompanhamento',
    ATIVIDADE_ASSISTENCIAL: 'Atividades assistenciais',
    REUNIAO_EQUIPE: 'Reuniões de equipe',
    ATIVIDADE_GERENCIAL: 'Atividades gerenciais'
  };

  var ROTULO_CATEGORIA = {
    'PROFISSIONAL DA EMPRESA': 'Profissional da empresa',
    'RESIDENTE': 'Residente',
    'ESTAGIÁRIO': 'Estagiário(a)'
  };

  // ---------- utilidades ----------

  /** Chama uma função do servidor e devolve uma Promise com os dados (ou erro com mensagem). */
  function chamar(nome) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (r) { r && r.ok ? resolve(r.dados) : reject(new Error(r ? r.erro : 'Sem resposta.')); })
        .withFailureHandler(function (e) { reject(erroDoGoogle(e)); })[nome].apply(null, args);
    });
  }

  /** Erro de armazenamento do Google (código INTERNAL): instabilidade do Google ou mais de uma conta no navegador. */
  function erroDoGoogle(e) {
    var msg = String((e && e.message) || e || '');
    if (/INTERNAL|armazenamento|storage/i.test(msg)) {
      return new Error('O Google não respondeu (código INTERNAL). Espere alguns minutos e atualize a página. ' +
        'Se continuar, pode ser mais de uma conta Google aberta no navegador: abra o sistema numa janela anônima ' +
        'ou num perfil do Chrome só com a conta cadastrada.');
    }
    return e;
  }

  /** Cria elementos sem usar innerHTML: h('td', { class: 'x' }, 'texto', filho...). */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === false || v === null || v === undefined) return;
      if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else el.setAttribute(k, v === true ? '' : v);
    });
    Array.prototype.slice.call(arguments, 2).forEach(function (filho) {
      if (filho === null || filho === undefined || filho === false) return;
      (Array.isArray(filho) ? filho : [filho]).forEach(function (f) {
        el.appendChild(typeof f === 'object' ? f : document.createTextNode(String(f)));
      });
    });
    return el;
  }

  function avisar(msg, tipo) {
    var el = document.getElementById('aviso');
    el.textContent = msg;
    el.className = 'aviso mostrar ' + (tipo || '');
    clearTimeout(avisar.t);
    avisar.t = setTimeout(function () { el.className = 'aviso'; }, tipo === 'erro' ? 6000 : 3000);
  }

  function campo(rotulo, controle) {
    var id = 'c' + Math.random().toString(36).slice(2, 8);
    controle.id = id;
    return h('div', { class: 'campo' }, h('label', { for: id }, rotulo), controle);
  }

  function seletor(nome, opcoes, valor, vazio) {
    var sel = h('select', { name: nome });
    if (vazio !== false) sel.appendChild(h('option', { value: '' }, vazio || 'Selecione…'));
    opcoes.forEach(function (o) {
      var op = typeof o === 'object' ? o : { valor: o, rotulo: o };
      sel.appendChild(h('option', { value: op.valor, selected: String(op.valor) === String(valor) }, op.rotulo));
    });
    return sel;
  }

  function lerFormulario(form) {
    var dados = {};
    Array.prototype.forEach.call(form.elements, function (el) { if (el.name) dados[el.name] = el.value; });
    return dados;
  }

  /** Desabilita o botão enquanto salva e mostra o resultado. */
  function enviar(botao, promessa, msgOk) {
    botao.disabled = true;
    return promessa.then(function (dados) {
      avisar(msgOk || 'Salvo.', 'ok');
      return dados;
    }).catch(function (e) {
      avisar(e.message, 'erro');
      throw e;
    }).finally(function () { botao.disabled = false; });
  }

  function tela(titulo) {
    var main = document.getElementById('conteudo');
    main.textContent = '';
    main.appendChild(h('h1', null, titulo));
    return main;
  }

  function ehCoordenacao() {
    return estado.usuario && estado.usuario.perfil === 'COORDENAÇÃO';
  }

  /** 'AAAA-MM-DD' -> 'DD/MM/AAAA'. */
  function dataBr(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
  }

  /** Valores ativos de uma lista de seleção. */
  function opcoesLista(nome) {
    return (estado.cad.listas[nome] || []).filter(function (i) { return i.ativo === 'SIM'; }).map(function (i) { return i.valor; });
  }

  function ativos(lista) {
    return lista.filter(function (x) { return x.ativo === 'SIM'; });
  }

  function opcoesUnidades() {
    return ativos(estado.cad.unidades).map(function (u) { return { valor: u.id, rotulo: u.nome + ' · ' + u.setor }; });
  }

  function opcoesProfissionais() {
    return ativos(estado.cad.profissionais).map(function (p) {
      return { valor: p.id, rotulo: p.nome + (p.categoria === 'PROFISSIONAL DA EMPRESA' ? '' : ' (' + ROTULO_CATEGORIA[p.categoria] + ')') };
    });
  }

  function prioridadePorId(id) {
    return estado.cad.prioridades.filter(function (p) { return p.id === id; })[0] || null;
  }

  function prioridadesDoTipo(tipo) {
    return ativos(estado.cad.prioridades).filter(function (p) { return p.tipo === tipo; });
  }

  /** Texto do prazo de uma prioridade: "ALTA · até 24h" ou "MODERADA · até 3 dias úteis (2x por semana ou mais)". */
  function rotuloPrioridade(p) {
    if (!p) return 'sem prazo definido';
    if (p.tipo === estado.cad.tipos_prioridade.solicitacao) return p.nome + ' · até ' + p.prazo + 'h';
    return p.nome + ' · até ' + p.prazo + ' dia(s) útil(eis)' + (p.periodicidade ? ' (' + p.periodicidade + ')' : '');
  }

  function opcoesJustificativas() {
    return ativos(estado.cad.justificativas).map(function (j) {
      return { valor: j.id, rotulo: j.nome + ' — ' + rotuloPrioridade(prioridadePorId(j.prioridade_id)) };
    });
  }

  function opcoesMotivos() {
    return ativos(estado.cad.motivos).map(function (m) {
      return { valor: m.id, rotulo: m.nome + ' — ' + rotuloPrioridade(prioridadePorId(m.prioridade_id)) };
    });
  }

  /** 'AAAA-MM-DD HH:MM' -> 'DD/MM/AAAA HH:MM'. */
  function dataHoraBr(dh) {
    return dh ? dataBr(dh.slice(0, 10)) + ' ' + dh.slice(11, 16) : '';
  }

  /** Hora atual do computador, 'HH:MM'. */
  function horaAgora() {
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  var CLASSE_SITUACAO = { 'ATRASADO': 'selo atrasado', 'VENCE HOJE': 'selo hoje', 'NO PRAZO': 'selo prazo' };

  function selo(situacao) {
    return situacao ? h('span', { class: CLASSE_SITUACAO[situacao] }, situacao.toLowerCase()) : '';
  }

  // ---------- navegação ----------

  var TELAS = {
    inicio: telaInicio,
    gestao: telaGestao,
    pacientes: telaPacientes,
    admissoes: telaAdmissoes,
    registro: telaRegistro,
    compilado: telaCompilado,
    cadastros: telaCadastros
  };

  function abrir(nome, arg) {
    estado.tela = nome;
    document.querySelectorAll('#menu button').forEach(function (b) {
      b.classList.toggle('ativo', b.dataset.tela === nome);
    });
    TELAS[nome](arg);
  }

  // ---------- Início: painel do dia ----------

  var ROTULO_TIPO_PRAZO = { '1º ATENDIMENTO': '1º atendimento', 'INTERCONSULTA': 'Interconsulta', 'RETORNO': 'Retorno' };

  function cartaoIndicador(numero, rotulo, classe, aoClicar) {
    return h('button', { type: 'button', class: 'indicador clicavel ' + (classe || ''), onclick: aoClicar },
      h('div', { class: 'numero' }, numero), h('div', null, rotulo));
  }

  function telaInicio() {
    var primeiro = estado.usuario.nome.split(' ')[0].toLowerCase().replace(/^./, function (c) { return c.toUpperCase(); });
    var main = tela('Olá, ' + primeiro);
    var resumo = h('div', { class: 'indicadores' }, h('p', { class: 'carregando' }, 'Carregando…'));
    var lista = h('div', { class: 'cartao tabela-rolagem' });
    main.appendChild(resumo);
    main.appendChild(lista);
    chamar('apiGestao', {}).then(function (g) {
      var r = g.resumo;
      resumo.textContent = '';
      resumo.appendChild(cartaoIndicador(r.pacientes, 'Pacientes em acompanhamento', '', function () { abrir('gestao', { aba: 'unidades' }); }));
      resumo.appendChild(cartaoIndicador(r.aguardando_primeiro, 'Aguardando 1º atendimento', '', function () { abrir('gestao', { aba: 'prazos' }); }));
      resumo.appendChild(cartaoIndicador(r.interconsultas_pendentes, 'Interconsultas pendentes', '', function () { abrir('gestao', { aba: 'interconsultas' }); }));
      resumo.appendChild(cartaoIndicador(r.atrasados, 'Com prazo atrasado', 'atrasado', function () { abrir('gestao', { aba: 'prazos', pendencia: 'ATRASADOS' }); }));
      resumo.appendChild(cartaoIndicador(r.vencem_hoje, 'Vencem hoje', 'hoje', function () { abrir('gestao', { aba: 'prazos', pendencia: 'PENDENTES' }); }));
      var urgentes = g.itens.filter(function (a) { return a.prazos.proximo && a.prazos.proximo.situacao !== 'NO PRAZO'; });
      lista.textContent = '';
      lista.appendChild(h('h2', null, 'Para atender hoje'));
      if (!urgentes.length) {
        lista.appendChild(h('p', { class: 'suave' }, 'Nenhum paciente com prazo atrasado ou vencendo hoje.'));
        return;
      }
      lista.appendChild(h('table', null,
        h('thead', null, h('tr', null, ['Paciente', 'Unidade', 'O que vence', 'Prazo', 'Situação'].map(function (t) { return h('th', null, t); }))),
        h('tbody', null, urgentes.map(function (a) {
          var p = a.prazos.proximo;
          return h('tr', { class: 'clicavel', onclick: function () { abrir('admissoes', { id: a.id }); } },
            h('td', null, h('strong', null, a.paciente_nome), h('div', { class: 'suave' }, 'Pront. ' + a.prontuario)),
            h('td', null, a.unidade_nome),
            h('td', null, ROTULO_TIPO_PRAZO[p.tipo] || p.tipo),
            h('td', null, p.prazo.length > 10 ? dataHoraBr(p.prazo) : dataBr(p.prazo)),
            h('td', null, selo(p.situacao)));
        }))));
    }).catch(function (e) { avisar(e.message, 'erro'); });
  }

  // ---------- Gestão: por unidade, interconsultas e prazos ----------

  var filtrosGestao = { setor_id: '', unidade_id: '', termo: '', incluir_encerrados: '', pendencia: '' };
  var filtrosInterconsultas = { situacao: 'PENDENTES', dias: '30', setor_id: '', prioridade: '' };

  /** "faltam 5h", "atrasada há 1d 3h" etc. */
  function textoHoras(horas) {
    var h0 = Math.abs(Number(horas) || 0);
    var dias = Math.floor(h0 / 24);
    var resto = Math.round(h0 - dias * 24);
    if (resto === 24) { dias++; resto = 0; }
    return (dias ? dias + 'd ' : '') + resto + 'h';
  }

  /** Célula de um prazo: data e selo da situação (pendente) ou do resultado (cumprido). */
  function celulaPrazo(p, comHora) {
    var data = function (v) { return comHora ? dataHoraBr(v) : dataBr(v); };
    if (!p.estado) return h('span', { class: 'suave' }, '—');
    if (p.estado === 'SEM PRAZO') return h('span', { class: 'suave' }, 'sem prazo');
    if (p.estado === 'NÃO SE APLICA') return h('span', { class: 'suave' }, 'não se aplica');
    if (p.estado === 'PENDENTE') {
      return h('div', null, data(p.prazo), ' ', selo(p.situacao),
        p.horas_restantes !== undefined && p.horas_restantes !== ''
          ? h('div', { class: 'suave' }, p.horas_restantes >= 0 ? 'faltam ' + textoHoras(p.horas_restantes) : 'atrasada há ' + textoHoras(p.horas_restantes))
          : '');
    }
    var classe = p.resultado === 'NO PRAZO' ? 'selo prazo' : 'selo atrasado';
    var quando = p.realizado ? (comHora ? dataHoraBr(p.realizado) : dataBr(p.realizado)) : 'não realizado';
    return h('div', null, quando, ' ', h('span', { class: classe }, p.resultado.toLowerCase()),
      p.horas !== undefined && p.horas !== '' ? h('div', { class: 'suave' }, 'em ' + String(p.horas).replace('.', ',') + 'h') : '');
  }

  function telaGestao(arg) {
    var main = tela('Gestão');
    var abas = h('div', { class: 'abas' });
    var corpo = h('div');
    var secoes = { unidades: ['Pacientes por unidade', gestaoUnidades], interconsultas: ['Interconsultas', gestaoInterconsultas], prazos: ['Prazos', gestaoPrazos] };
    if (arg && arg.pendencia) filtrosGestao.pendencia = arg.pendencia;
    function mostrar(chave) {
      telaGestao.aba = chave;
      abas.querySelectorAll('button').forEach(function (b) { b.classList.toggle('ativo', b.dataset.aba === chave); });
      corpo.textContent = '';
      secoes[chave][1](corpo);
    }
    Object.keys(secoes).forEach(function (k) {
      abas.appendChild(h('button', { type: 'button', 'data-aba': k, onclick: function () { mostrar(k); } }, secoes[k][0]));
    });
    main.appendChild(abas);
    main.appendChild(corpo);
    mostrar((arg && arg.aba) || telaGestao.aba || 'unidades');
  }

  /** Filtros comuns: setor, unidade, busca e pendência. Chama aoMudar com os valores. */
  function filtrosDeGestao(alvo, extras, aoMudar) {
    var setores = estado.cad.setores.map(function (x) { return { valor: x.id, rotulo: x.nome }; });
    var form = h('form', { class: 'linha' },
      campo('Paciente', h('input', { name: 'termo', type: 'search', placeholder: 'Nome ou prontuário', value: filtrosGestao.termo })),
      campo('Setor', seletor('setor_id', setores, filtrosGestao.setor_id, 'Todos')),
      campo('Unidade', seletor('unidade_id', opcoesUnidades(), filtrosGestao.unidade_id, 'Todas')),
      campo('Mostrar', seletor('pendencia', [{ valor: 'PENDENTES', rotulo: 'Só com prazo pendente' }, { valor: 'ATRASADOS', rotulo: 'Só atrasados' }],
        filtrosGestao.pendencia, 'Todos os pacientes')),
      extras || null);
    var espera;
    var mudar = function () { filtrosGestao = Object.assign(filtrosGestao, lerFormulario(form)); aoMudar(); };
    form.addEventListener('input', function () { clearTimeout(espera); espera = setTimeout(mudar, 350); });
    form.addEventListener('change', mudar);
    form.addEventListener('submit', function (ev) { ev.preventDefault(); mudar(); });
    alvo.appendChild(h('div', { class: 'cartao' }, form));
    return form;
  }

  function gestaoUnidades(alvo) {
    var incluir = h('label', { class: 'marcacao' },
      h('input', { type: 'checkbox', checked: filtrosGestao.incluir_encerrados === 'SIM' }), ' Incluir quem teve desfecho psicológico e segue internado');
    var lista = h('div', null, h('p', { class: 'carregando' }, 'Carregando…'));
    function carregar() {
      filtrosGestao.incluir_encerrados = incluir.querySelector('input').checked ? 'SIM' : '';
      chamar('apiGestao', filtrosGestao).then(function (g) {
        lista.textContent = '';
        lista.appendChild(h('p', { class: 'suave' }, g.itens.length + ' paciente(s) em acompanhamento, sem desfecho.'));
        if (!g.itens.length) return;
        // Agrupa por setor e unidade, na ordem dos cadastros.
        var porUnidade = {};
        g.itens.forEach(function (a) { (porUnidade[a.unidade_id] = porUnidade[a.unidade_id] || []).push(a); });
        estado.cad.setores.forEach(function (s) {
          var unidades = estado.cad.unidades.filter(function (u) { return u.setor_id === s.id && porUnidade[u.id]; });
          if (!unidades.length) return;
          var total = unidades.reduce(function (n, u) { return n + porUnidade[u.id].length; }, 0);
          lista.appendChild(h('h2', { class: 'subtitulo-secao' }, s.nome, h('span', { class: 'suave' }, ' · ' + total + ' paciente(s)')));
          unidades.forEach(function (u) {
            var itens = porUnidade[u.id];
            var atrasados = itens.filter(function (a) { return a.prazos.proximo && a.prazos.proximo.situacao === 'ATRASADO'; }).length;
            lista.appendChild(h('div', { class: 'cartao tabela-rolagem' },
              h('h2', null, u.nome, h('span', { class: 'suave' }, ' · ' + itens.length + ' paciente(s)'),
                atrasados ? h('span', { class: 'selo atrasado espaco' }, atrasados + ' atrasado(s)') : ''),
              h('table', null,
                h('thead', null, h('tr', null, ['Paciente', 'Situação', 'Justificativa e prioridade', 'Último atendimento', 'Próximo prazo']
                  .map(function (t) { return h('th', null, t); }))),
                h('tbody', null, itens.map(function (a) {
                  var p = a.prazos.proximo;
                  return h('tr', { class: 'clicavel', onclick: function () { abrir('admissoes', { id: a.id }); } },
                    h('td', null, h('strong', null, a.paciente_nome),
                      h('div', { class: 'suave' }, 'Pront. ' + a.prontuario + ' · internado há ' + a.dias_internado + ' dia(s)')),
                    h('td', null, seloStatus(a)),
                    h('td', null, a.justificativa_nome || h('span', { class: 'suave' }, '—'),
                      a.prioridade_demanda ? h('div', { class: 'suave' }, a.prioridade_demanda.toLowerCase() + (a.periodicidade ? ' · ' + a.periodicidade : '')) : ''),
                    h('td', null, dataBr(a.ultimo_contato) || h('span', { class: 'suave' }, 'nenhum')),
                    h('td', null, p ? h('div', null, h('div', { class: 'suave' }, ROTULO_TIPO_PRAZO[p.tipo]),
                      p.prazo.length > 10 ? dataHoraBr(p.prazo) : dataBr(p.prazo), ' ', selo(p.situacao)) : h('span', { class: 'suave' }, '—')));
                })))));
          });
        });
      }).catch(function (e) { avisar(e.message, 'erro'); });
    }
    var form = filtrosDeGestao(alvo, h('div', { class: 'campo' }, h('label', null, ' '), incluir), carregar);
    void form;
    alvo.appendChild(lista);
    carregar();
  }

  function gestaoPrazos(alvo) {
    var lista = h('div', { class: 'cartao tabela-rolagem' }, h('p', { class: 'carregando' }, 'Carregando…'));
    function carregar() {
      chamar('apiGestao', Object.assign({}, filtrosGestao, { incluir_encerrados: '' })).then(function (g) {
        lista.textContent = '';
        lista.appendChild(h('p', { class: 'suave' },
          'Prazos de cada paciente: 1º atendimento em até ' + parametroPrazoPrimeiro() + ' dia(s) útil(eis) da admissão, ' +
          'resposta à interconsulta em horas pela prioridade do motivo, e retorno em dias úteis pela prioridade da justificativa.'));
        if (!g.itens.length) { lista.appendChild(h('p', { class: 'suave' }, 'Nenhum paciente encontrado.')); return; }
        lista.appendChild(h('table', null,
          h('thead', null, h('tr', null, ['Paciente', '1º atendimento', 'Interconsulta', 'Retorno (seguimento)']
            .map(function (t) { return h('th', null, t); }))),
          h('tbody', null, g.itens.map(function (a) {
            return h('tr', { class: 'clicavel', onclick: function () { abrir('admissoes', { id: a.id }); } },
              h('td', null, h('strong', null, a.paciente_nome), h('div', { class: 'suave' }, a.unidade_nome + ' · admissão ' + dataBr(a.data_admissao))),
              h('td', null, celulaPrazo(a.prazos.primeiro, false)),
              h('td', null, a.prazos.interconsulta.prioridade ? h('div', { class: 'suave' }, a.prazos.interconsulta.prioridade.toLowerCase()) : '',
                celulaPrazo(a.prazos.interconsulta, true)),
              h('td', null, a.prazos.retorno.prioridade ? h('div', { class: 'suave' }, a.prazos.retorno.prioridade.toLowerCase() + (a.periodicidade ? ' · ' + a.periodicidade : '')) : '',
                celulaPrazo(a.prazos.retorno, false)));
          }))));
      }).catch(function (e) { avisar(e.message, 'erro'); });
    }
    filtrosDeGestao(alvo, null, carregar);
    alvo.appendChild(lista);
    carregar();
  }

  function parametroPrazoPrimeiro() {
    var p = estado.cad.parametros.filter(function (x) { return x.chave === 'PRAZO_PRIMEIRO_ATENDIMENTO_DIAS_UTEIS'; })[0];
    return p ? p.valor : '3';
  }

  function gestaoInterconsultas(alvo) {
    var setores = estado.cad.setores.map(function (x) { return { valor: x.id, rotulo: x.nome }; });
    var prioridades = prioridadesDoTipo(estado.cad.tipos_prioridade.solicitacao).map(function (p) { return { valor: p.nome, rotulo: rotuloPrioridade(p) }; });
    var f = filtrosInterconsultas;
    var form = h('form', { class: 'linha' },
      campo('Mostrar', seletor('situacao', [{ valor: 'PENDENTES', rotulo: 'Aguardando resposta' }, { valor: 'RESPONDIDAS', rotulo: 'Respondidas' },
        { valor: 'TODAS', rotulo: 'Todas' }], f.situacao, false)),
      campo('Período (respondidas)', seletor('dias', [{ valor: '7', rotulo: 'Últimos 7 dias' }, { valor: '30', rotulo: 'Últimos 30 dias' },
        { valor: '90', rotulo: 'Últimos 90 dias' }], f.dias, false)),
      campo('Prioridade', seletor('prioridade', prioridades, f.prioridade, 'Todas')),
      campo('Setor', seletor('setor_id', setores, f.setor_id, 'Todos')));
    var resumo = h('div', { class: 'indicadores' });
    var lista = h('div', { class: 'cartao tabela-rolagem' }, h('p', { class: 'carregando' }, 'Carregando…'));
    function carregar() {
      filtrosInterconsultas = lerFormulario(form);
      chamar('apiInterconsultas', filtrosInterconsultas).then(function (d) {
        var r = d.resumo;
        resumo.textContent = '';

    function formulario(titulo, api, campos, msg) {

        });
        return h('tr', null, colunas.map(function (c) { return h('td', null, c(r)); }), h('td', null, apagar));

  // ---------- Compilado ----------

  var NOMES_MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro',
    'Outubro', 'Novembro', 'Dezembro'];

  function formatarValor(valor, tipo) {
    if (valor === null || valor === undefined) return '—';
    if (tipo === 'pct') return Math.round(valor * 100) + '%';
    if (tipo === 'media') return (Math.round(valor * 10) / 10).toString().replace('.', ',');
    return String(valor);
  }

  var filtrosCompilado = null;

  function telaCompilado() {
    var main = tela('Compilado');
    var hojeP = estado.cad.hoje.split('-');
    if (!filtrosCompilado) {
      filtrosCompilado = { eixo: 'UNIDADE', ano: hojeP[0], mes: String(Number(hojeP[1])), grupo: 'TODOS', setor_id: '', unidade_id: '' };
    }
    var f = filtrosCompilado;
    var anos = [];
    for (var a = Number(hojeP[0]); a >= 2026; a--) anos.push(String(a));
    if (anos.indexOf(f.ano) === -1) anos.push(f.ano);
    var grupos = Object.keys(estado.cad.grupos).map(function (k) { return { valor: k, rotulo: estado.cad.grupos[k] }; });
    var setores = estado.cad.setores.map(function (x) { return { valor: x.id, rotulo: x.nome }; });
    var campoMes = campo('Mês', seletor('mes', NOMES_MESES.map(function (m, i) { return { valor: String(i + 1), rotulo: m }; }), f.mes, false));
    var form = h('form', { class: 'linha nao-imprimir' },
      campo('Compilado', seletor('eixo', [{ valor: 'UNIDADE', rotulo: 'Mensal, por unidade' }, { valor: 'MES', rotulo: 'Anual, por mês' }], f.eixo, false)),
      campo('Ano', seletor('ano', anos, f.ano, false)),
      campoMes,
      campo('Profissionais', seletor('grupo', grupos, f.grupo, false)),
      campo('Setor', seletor('setor_id', setores, f.setor_id, 'Todos')),
      campo('Unidade', seletor('unidade_id', opcoesUnidades(), f.unidade_id, 'Todas')));
    var exportar = h('button', { class: 'btn sec', type: 'button' }, 'Exportar para Google Planilhas');
    var imprimir = h('button', { class: 'btn sec', type: 'button', onclick: function () { window.print(); } }, 'Imprimir');
    var resultado = h('div', null, h('p', { class: 'carregando' }, 'Carregando…'));

    function gerar() {
      filtrosCompilado = lerFormulario(form);
      campoMes.hidden = filtrosCompilado.eixo === 'MES';
      resultado.textContent = '';
      resultado.appendChild(h('p', { class: 'carregando' }, 'Calculando…'));
      chamar('apiCompilado', filtrosCompilado).then(desenharCompilado).catch(function (e) { avisar(e.message, 'erro'); });
    }

    function desenharCompilado(c) {
      resultado.textContent = '';
      resultado.appendChild(h('div', { class: 'cabecalho-compilado' }, h('h2', null, c.titulo), h('div', { class: 'suave' }, c.subtitulo)));
      c.secoes.forEach(function (s) {
        var cabecalho = [h('th', { class: 'rotulo' }, s.titulo)];
        if (!s.semColunas) c.colunas.forEach(function (col) { cabecalho.push(h('th', null, col.nome)); });
        cabecalho.push(h('th', { class: 'total' }, 'Total'));
        var corpo = s.linhas.map(function (l) {
          var celulas = [h('td', { class: 'rotulo' }, l.rotulo)];
          if (!s.semColunas) {
            l.valores.forEach(function (v) {
              celulas.push(h('td', { class: (v === 0 || v === null) ? 'zero' : '' }, formatarValor(v, l.tipo)));
            });
          }
          celulas.push(h('td', { class: 'total' }, formatarValor(l.total, l.tipo)));
          return h('tr', { class: l.destaque ? 'destaque' : '' }, celulas);
        });
        resultado.appendChild(h('div', { class: 'cartao secao-compilado' },
          h('div', { class: 'tabela-rolagem' }, h('table', { class: 'compilado' }, h('thead', null, h('tr', null, cabecalho)), h('tbody', null, corpo))),
          s.nota ? h('p', { class: 'nota' }, s.nota) : null));
      });
    }

    exportar.addEventListener('click', function () {
      enviar(exportar, chamar('apiExportarCompilado', lerFormulario(form)), 'Planilha criada.').then(function (r) {
        var link = h('a', { href: r.url, target: '_blank', rel: 'noopener' }, 'Abrir "' + r.nome + '"');
        resultado.insertBefore(h('div', { class: 'cartao' }, 'Planilha criada no seu Google Drive. ', link), resultado.firstChild);
      }).catch(function () {});
    });
    form.addEventListener('change', gerar);
    main.appendChild(h('div', { class: 'cartao nao-imprimir' }, form, h('div', { class: 'linha acoes' }, exportar, imprimir)));
    main.appendChild(resultado);
    gerar();
  }

  /** Monta uma seção de cadastro: tabela à esquerda, formulário de edição abaixo. */
  function secaoCadastro(alvo, cfg) {
    var formArea = h('div', { class: 'cartao' });

    function editar(item) {
      formArea.textContent = '';
      var form = h('form', { class: 'linha' }, h('input', { type: 'hidden', name: 'id', value: item.id || '' }));
      cfg.campos(item).forEach(function (c) { form.appendChild(c); });
      if (!cfg.semAtivo) form.appendChild(campo('Ativo', seletor('ativo', ['SIM', 'NÃO'], item.ativo || 'SIM', false)));
      var botao = h('button', { class: 'btn', type: 'submit' }, item.id ? 'Salvar' : 'Adicionar');
      var novo = h('button', { class: 'btn sec', type: 'button', onclick: function () { editar({}); } }, 'Novo');
      form.appendChild(botao);
      form.appendChild(novo);
      if (item.id && cfg.apiExcluir) {
        var apagar = h('button', { class: 'btn perigo', type: 'button' }, 'Excluir');
        apagar.addEventListener('click', function () {
          if (!confirm('Excluir este registro?')) return;
          enviar(apagar, chamar(cfg.apiExcluir, item.id), 'Excluído.').then(cfg.aoSalvar).catch(function () {});
        });
        form.appendChild(apagar);
      }
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var dados = Object.assign(cfg.extra ? cfg.extra() : {}, lerFormulario(form));
        enviar(botao, chamar(cfg.api, dados)).then(cfg.aoSalvar).catch(function () {});
      });
      formArea.appendChild(h('h2', null, item.id ? 'Editar' : 'Adicionar'));
      formArea.appendChild(form);
    }

    alvo.appendChild(formArea);
    alvo.appendChild(h('div', { class: 'cartao tabela-rolagem' }, h('table', null,
      h('thead', null, h('tr', null, cfg.colunas.map(function (c) { return h('th', null, c[0]); }))),
      h('tbody', null, cfg.itens.map(function (item) {
        return h('tr', { class: 'clicavel' + (item.ativo === 'NÃO' ? ' inativo' : ''), onclick: function () { editar(item); } },
          cfg.colunas.map(function (c) { return h('td', null, c[1](item)); }));
      })))));
    editar({});
  }

        return [
          campo('Desfecho', h('input', { name: 'nome', value: d.nome || '', required: true })),
          campo('Encerra a admissão?', seletor('encerra_admissao', [{ valor: 'SIM', rotulo: 'Sim, paciente saiu do hospital' },
            { valor: 'NÃO', rotulo: 'Não, encerra só o acompanhamento' }], d.encerra_admissao || 'NÃO', false)),
          campo('Ordem', h('input', { name: 'ordem', type: 'number', value: d.ordem || '' }))
        ];
      }
    });
  }

  function cadParametros(alvo, aoSalvar) {
    var param = function (chave) { return estado.cad.parametros.filter(function (x) { return x.chave === chave; })[0]; };
    var p = param('PRAZO_PRIMEIRO_ATENDIMENTO_DIAS_UTEIS');
    if (p) {
      var form = h('form', { class: 'linha' },
        campo('Dias úteis para o 1º atendimento', h('input', { name: 'valor', type: 'number', min: 0, value: p.valor, required: true })));
      var botao = h('button', { class: 'btn', type: 'submit' }, 'Salvar');
      form.appendChild(botao);
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        enviar(botao, chamar('apiSalvarParametro', Object.assign(lerFormulario(form), { id: p.id }))).then(aoSalvar).catch(function () {});
      });
      alvo.appendChild(h('div', { class: 'cartao' }, h('h2', null, '1º atendimento após a admissão'), h('p', { class: 'suave' }, p.descricao +
        ' Admissões que tiverem desfecho dentro desse prazo sem terem sido atendidas ficam fora do indicador.'), form));
    }
    var t = param('TIPOS_SOLICITACAO_COM_PRAZO');
    if (t) {
      var marcados = String(t.valor || '').split(',').map(function (x) { return x.trim(); });
      var caixas = opcoesLista('TIPO_SOLICITACAO').map(function (tipo) {
        return h('label', { class: 'marcacao' }, h('input', { type: 'checkbox', value: tipo, checked: marcados.indexOf(tipo) !== -1 }), ' ' + tipo);
      });
      var botaoT = h('button', { class: 'btn', type: 'button' }, 'Salvar');
      botaoT.addEventListener('click', function () {
        var valor = caixas.map(function (c) { return c.querySelector('input'); }).filter(function (i) { return i.checked; })
          .map(function (i) { return i.value; }).join(',');
        enviar(botaoT, chamar('apiSalvarParametro', { id: t.id, valor: valor })).then(aoSalvar).catch(function () {});
      });
      alvo.appendChild(h('div', { class: 'cartao' }, h('h2', null, 'Prazo de resposta à solicitação'),
        h('p', { class: 'suave' }, 'Tipos de solicitação que têm prazo de resposta pela matriz de atendimento (24h, 48h, 72h…).'),
        h('div', { class: 'linha' }, caixas, botaoT)));
    }
  }

  function cadFeriados(alvo, aoSalvar) {
    alvo.appendChild(h('p', { class: 'suave' }, 'Feriados não contam como dia útil nos prazos. Inclua os estaduais, municipais e pontos facultativos.'));
    secaoCadastro(alvo, {
      api: 'apiSalvarFeriado',
      apiExcluir: 'apiExcluirFeriado',
      semAtivo: true,
      aoSalvar: aoSalvar,
      itens: estado.cad.feriados.slice().reverse(),
      colunas: [['Data', function (f) { return dataBr(f.data); }], ['Descrição', function (f) { return f.descricao; }]],
      campos: function (f) {
        return [
          campo('Data', h('input', { name: 'data', type: 'date', value: f.data || '', required: true })),
          campo('Descrição', h('input', { name: 'descricao', value: f.descricao || '' }))
        ];
      }
    });
  }

  function cadUnidades(alvo, aoSalvar) {
    var setores = estado.cad.setores.map(function (s) { return { valor: s.id, rotulo: s.nome }; });
    var blocoSetores = h('div');
    var blocoUnidades = h('div');
    alvo.appendChild(h('h2', null, 'Unidades'));
    alvo.appendChild(blocoUnidades);
    alvo.appendChild(h('h2', null, 'Setores'));
    alvo.appendChild(blocoSetores);
    secaoCadastro(blocoUnidades, {
      api: 'apiSalvarUnidade',
      aoSalvar: aoSalvar,
      itens: estado.cad.unidades,
      colunas: [['Unidade', function (u) { return u.nome; }], ['Setor', function (u) { return u.setor; }],
        ['Ordem', function (u) { return u.ordem; }]],
      campos: function (u) {
        return [
          campo('Unidade', h('input', { name: 'nome', value: u.nome || '', required: true })),
          campo('Setor', seletor('setor_id', setores, u.setor_id)),
          campo('Ordem', h('input', { name: 'ordem', type: 'number', value: u.ordem || '' }))
        ];
      }
    });
    secaoCadastro(blocoSetores, {
      api: 'apiSalvarSetor',
      aoSalvar: aoSalvar,
      itens: estado.cad.setores,
      colunas: [['Setor', function (s) { return s.nome; }], ['Ordem', function (s) { return s.ordem; }]],
      campos: function (s) {
        return [
          campo('Setor', h('input', { name: 'nome', value: s.nome || '', required: true })),
          campo('Ordem', h('input', { name: 'ordem', type: 'number', value: s.ordem || '' }))
        ];
      }
    });
  }

  function cadListas(alvo, aoSalvar) {
    var nomes = Object.keys(NOMES_LISTAS);
    var escolha = seletor('lista', nomes.map(function (n) { return { valor: n, rotulo: NOMES_LISTAS[n] }; }),
      cadListas.atual || nomes[0], false);
    var bloco = h('div');
    function desenhar() {
      cadListas.atual = escolha.value;
      bloco.textContent = '';
      secaoCadastro(bloco, {
        api: 'apiSalvarItemLista',
        aoSalvar: aoSalvar,
        extra: function () { return { lista: escolha.value }; },
        itens: estado.cad.listas[escolha.value] || [],
        colunas: [['Valor', function (i) { return i.valor; }], ['Ordem', function (i) { return i.ordem; }]],
        campos: function (i) {
          return [
            campo('Valor', h('input', { name: 'valor', value: i.valor || '', required: true })),
            campo('Ordem', h('input', { name: 'ordem', type: 'number', value: i.ordem || '' }))
          ];
        }
      });
    }
    escolha.addEventListener('change', desenhar);
    alvo.appendChild(h('div', { class: 'cartao' }, campo('Lista', escolha)));
    alvo.appendChild(bloco);
    desenhar();
  }

  // ---------- início ----------

  document.getElementById('menu').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-tela]');
    if (b) abrir(b.dataset.tela);
  });

  chamar('apiInicio').then(function (dados) {
    estado.usuario = dados.usuario;
    estado.cad = dados;
    document.getElementById('usuario').textContent = dados.usuario.nome + ' · ' + dados.usuario.perfil.toLowerCase();
    if (!ehCoordenacao()) document.querySelectorAll('[data-coordenacao]').forEach(function (b) { b.remove(); });
    abrir('inicio');
  }).catch(function (e) {
    var main = tela('Sem acesso');
    main.appendChild(h('div', { class: 'cartao' }, h('p', null, e.message)));
  });
</script>
