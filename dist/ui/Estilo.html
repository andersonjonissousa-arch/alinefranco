<style>
  :root {
    --fundo: #f5f7fa;
    --cartao: #ffffff;
    --texto: #1f2933;
    --suave: #616e7c;
    --borda: #d9e2ec;
    --primaria: #2f6f9f;
    --primaria-escura: #245a82;
    --perigo: #b42318;
    --ok: #1a7f37;
    --raio: 8px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto);
    background: var(--fundo);
  }
  .topo {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 10px 16px; background: var(--cartao); border-bottom: 1px solid var(--borda);
    position: sticky; top: 0; z-index: 5;
  }
  .marca { font-weight: 700; color: var(--primaria); }
  .menu { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
  .menu button {
    border: 0; background: none; padding: 8px 12px; border-radius: var(--raio);
    color: var(--suave); cursor: pointer; font: inherit;
  }
  .menu button:hover { background: var(--fundo); }
  .menu button.ativo { background: #e3edf6; color: var(--primaria-escura); font-weight: 600; }
  .usuario { color: var(--suave); font-size: 13px; }

  .conteudo { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 16px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .cartao {
    background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--raio);
    padding: 16px; margin-bottom: 16px;
  }
  .suave { color: var(--suave); }
  .carregando { color: var(--suave); }

  .linha { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .campo { display: flex; flex-direction: column; gap: 4px; min-width: 160px; flex: 1; }
  .campo label { font-size: 13px; color: var(--suave); }
  input, select, textarea {
    font: inherit; padding: 8px 10px; border: 1px solid var(--borda); border-radius: 6px;
    background: #fff; color: var(--texto); width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid #b6d4ec; border-color: var(--primaria); }

  button.btn {
    font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--primaria);
    background: var(--primaria); color: #fff; cursor: pointer; white-space: nowrap;
  }
  button.btn:hover { background: var(--primaria-escura); }
  button.btn.sec { background: #fff; color: var(--primaria); }
  button.btn:disabled { opacity: .6; cursor: wait; }

  .tabela-rolagem { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  th { font-size: 13px; color: var(--suave); font-weight: 600; }
  tr.clicavel { cursor: pointer; }
  tr.clicavel:hover td { background: #f0f5fa; }
  .inativo td { color: #9aa5b1; }

  .abas { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
  .abas button {
    font: inherit; border: 1px solid var(--borda); background: #fff; border-radius: 999px;
    padding: 6px 12px; cursor: pointer; color: var(--suave);
  }
  .abas button.ativo { border-color: var(--primaria); color: var(--primaria-escura); background: #e3edf6; }

  .aviso {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--texto); color: #fff; padding: 10px 16px; border-radius: var(--raio);
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw;
  }
  .aviso.mostrar { opacity: 1; }
  .aviso.erro { background: var(--perigo); }
  .aviso.ok { background: var(--ok); }

  button.btn.perigo { background: #fff; color: var(--perigo); border-color: var(--perigo); }
  button.link {
    font: inherit; border: 0; background: none; padding: 0; cursor: pointer;
    color: var(--primaria); text-decoration: underline;
  }
  button.link.perigo { color: var(--perigo); }
  button.opcao {
    display: block; width: 100%; text-align: left; font: inherit; padding: 8px 10px; margin-bottom: 4px;
    border: 1px solid var(--borda); border-radius: 6px; background: #fff; cursor: pointer;
  }
  button.opcao:hover { border-color: var(--primaria); background: #f0f5fa; }
  .voltar { margin-bottom: 12px; }

  .selo {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: #eef2f6; color: var(--suave); white-space: nowrap;
  }
  .selo.atrasado { background: #fde8e7; color: var(--perigo); }
  .selo.hoje { background: #fff4d6; color: #8a5a00; }
  .selo.prazo { background: #e6f4ea; color: var(--ok); }

  .indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .indicador { background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--raio); padding: 14px 16px; color: var(--suave); }
  .indicador .numero { font-size: 28px; font-weight: 700; color: var(--texto); }
  .indicador.atrasado .numero { color: var(--perigo); }
  .indicador.hoje .numero { color: #8a5a00; }
  .indicador.prazo .numero { color: var(--ok); }
  button.indicador { font: inherit; text-align: left; cursor: pointer; }
  button.indicador:hover { border-color: var(--primaria); background: #f7fafd; }
  .selo.espaco { margin-left: 8px; vertical-align: middle; }

  .cabecalho-caso { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; }
  fieldset { border: 1px solid var(--borda); border-radius: var(--raio); padding: 12px 14px 14px; margin: 0 0 14px; }
  legend { font-weight: 600; padding: 0 6px; }
  details > summary { cursor: pointer; list-style: revert; }
  details[open] > summary { margin-bottom: 12px; }
  h2.inline { display: inline; }

  .em-breve { text-align: center; padding: 40px 16px; color: var(--suave); }

  .acoes { margin-top: 12px; }
  label.marcacao { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; }
  label.marcacao input { width: auto; }
  .subtitulo-secao { margin-top: 24px; }
  .cabecalho-compilado { margin: 8px 0 12px; }
  .cabecalho-compilado h2 { font-size: 19px; margin: 0; }
  .secao-compilado { padding: 0; overflow: hidden; }
  .secao-compilado .nota { margin: 0; padding: 8px 12px 12px; font-size: 13px; color: var(--suave); font-style: italic; }
  table.compilado { font-size: 13px; font-variant-numeric: tabular-nums; }
  table.compilado th, table.compilado td { padding: 6px 8px; text-align: right; white-space: nowrap; }
  table.compilado .rotulo {
    text-align: left; white-space: normal; min-width: 220px; position: sticky; left: 0; background: var(--cartao);
  }
  table.compilado thead th { background: #e8eef7; color: var(--texto); }
  table.compilado thead th.rotulo { background: #e8eef7; font-size: 14px; }
  table.compilado .total { font-weight: 600; background: #f3f6f9; }
  table.compilado tr.destaque td { font-weight: 700; background: #f7f9fb; }
  table.compilado td.zero { color: #b8c2cc; }

  @media print {
    body { background: #fff; font-size: 11px; }
    .topo, .nao-imprimir, .aviso { display: none !important; }
    .conteudo { max-width: none; padding: 0; }
    h1 { display: none; }
    .cartao { border: 0; padding: 0; margin-bottom: 10px; break-inside: avoid; }
    .tabela-rolagem { overflow: visible; }
    table.compilado .rotulo { position: static; min-width: 0; }
    table.compilado th, table.compilado td { padding: 2px 4px; border-bottom: 1px solid #ddd; }
  }

  @media (max-width: 720px) {
    .topo { padding: 8px 12px; }
    .marca { flex: 1; }
    .menu { order: 3; flex: 0 0 100%; flex-wrap: nowrap; overflow-x: auto; margin: 0 -12px; padding: 0 12px; }
    .menu button { flex: 0 0 auto; }
    .conteudo { padding: 12px; }
    .campo { min-width: 100%; }
    .tabela-rolagem table { min-width: 600px; }
  }
</style>
